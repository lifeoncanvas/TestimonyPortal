server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name testimonyportal.com www.testimonyportal.com _;

    # KingsChat OAuth callback (both GET and POST)
    location /kingschat/callback {
        proxy_pass http://127.0.0.1:8083/api/auth/kingschat/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exact root "/" - KingsChat POSTs the auth code here
    # Using error_page trick because "if + proxy_pass" is broken in nginx
    location = / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;

        # If the request is POST, use error_page to redirect internally to @backend
        error_page 405 = @kingschat_post;
    }

    # Named location: proxy POST to Spring Boot backend
    location @kingschat_post {
        proxy_pass http://127.0.0.1:8083/api/auth/kingschat/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other frontend routes - serve React SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # API routes - proxy to Spring Boot
    location /api/ {
        proxy_pass http://127.0.0.1:8083/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
